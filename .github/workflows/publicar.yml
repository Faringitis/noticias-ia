# Cuando Claude sube la edición del día: la valida, actualiza la página web y la manda por
# Telegram y mail. También corre a horario fijo como red de seguridad: si a las 8:00 no hay
# edición, manda un aviso con los titulares sin resumir.
name: 2 · Publicar y enviar

on:
  push:
    branches: [main]
    paths: ["ediciones/**", "scripts/publicar.py", "sitio/**", ".github/workflows/publicar.yml"]
  schedule:
    - cron: "23 10 * * *"   # 07:23 Argentina: por si el aviso automático no llegó
    - cron: "7 11 * * *"    # 08:07 Argentina: último intento; si no hay edición, respaldo
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha AAAA-MM-DD (vacío = hoy)"
        required: false
      reenviar:
        description: "Volver a mandar aunque ya se haya enviado"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-escritura
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SITIO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fecha
        id: fecha
        run: |
          F="${{ inputs.fecha }}"
          [ -z "$F" ] && F=$(TZ=America/Argentina/Buenos_Aires date +%F)
          echo "valor=$F" >> "$GITHUB_OUTPUT"
          echo "Fecha: $F"

      - name: Traer ediciones que Claude haya dejado en ramas claude/*
        run: |
          git fetch --quiet origin '+refs/heads/claude/*:refs/remotes/origin/claude/*' || true
          for rama in $(git branch -r --list 'origin/claude/*'); do
            for f in $(git ls-tree --name-only -r "$rama" -- ediciones/ | grep -E '^ediciones/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' || true); do
              if [ ! -f "$f" ]; then
                git show "$rama:$f" > "$f"
                echo "Traída $f desde $rama"
              fi
            done
          done

      - name: Control de calidad
        id: control
        run: |
          F=ediciones/${{ steps.fecha.outputs.valor }}.json
          if [ ! -f "$F" ]; then echo "hay=no" >> "$GITHUB_OUTPUT"; echo "Todavía no hay edición."; exit 0; fi
          if python3 scripts/validar.py "$F"; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "::error::La edición no pasó el control de calidad; no se publica."
            mkdir -p estado/rechazadas && mv "$F" estado/rechazadas/
            echo "hay=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Armar la página
        run: python3 scripts/publicar.py --sitio

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _sitio
      - name: Publicar la página
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Enviar por Telegram y mail
        # always(): el informe sale aunque falle la actualización de la página (pasó el 05/11).
        if: always() && steps.control.outputs.hay == 'si'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAIL_USUARIO: ${{ secrets.MAIL_USUARIO }}
          MAIL_CLAVE_APP: ${{ secrets.MAIL_CLAVE_APP }}
          MAIL_DESTINO: ${{ secrets.MAIL_DESTINO }}
        run: |
          F=${{ steps.fecha.outputs.valor }}
          if [ "${{ inputs.reenviar }}" = "true" ]; then
            python3 -c "import json,pathlib; p=pathlib.Path('estado/enviados.json'); d=json.loads(p.read_text()) if p.exists() else {}; d.pop('$F', None); p.write_text(json.dumps(d, indent=2))"
          fi
          python3 scripts/enviar.py --fecha "$F"

      - name: Respaldo si a las 8 no hay edición
        if: always() && steps.control.outputs.hay == 'no' && github.event_name == 'schedule'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAIL_USUARIO: ${{ secrets.MAIL_USUARIO }}
          MAIL_CLAVE_APP: ${{ secrets.MAIL_CLAVE_APP }}
          MAIL_DESTINO: ${{ secrets.MAIL_DESTINO }}
        run: |
          if [ "$(TZ=America/Argentina/Buenos_Aires date +%H)" -ge 8 ]; then
            # Los titulares del respaldo salen de las fuentes, recién leídas.
            python3 scripts/recolectar.py || true
            python3 scripts/enviar.py --respaldo
          else
            echo "Todavía es temprano: espero a la corrida de las 8:07."
          fi

      - name: Guardar estado en el repositorio
        if: always()
        run: |
          # Las anotaciones se ven sin iniciar sesión: si esto falla, queda el motivo a la vista.
          trap 'echo "::error title=Guardar estado::Falló: $BASH_COMMAND"' ERR
          git config user.name "noticias-ia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ediciones estado
          date -u +%FT%TZ > estado/ultima_publicacion.txt
          git add -A ediciones estado
          git commit -q -m "Publicación ${{ steps.fecha.outputs.valor }}"
          for intento in 1 2 3 4; do
            if salida=$( { git pull --rebase --quiet origin main && git push --quiet origin HEAD:main; } 2>&1 ); then
              echo "Estado guardado."
              exit 0
            fi
            echo "Intento $intento falló: $salida"
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 10))
          done
          echo "::error title=No se pudo guardar el estado::$(echo "$salida" | tail -n 3 | tr '\n' ' ')"
          exit 1
